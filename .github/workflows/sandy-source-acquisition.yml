name: Sandy source acquisition (review only)
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Sandy engineering issue number
        required: true
        type: string
      edge_function:
        description: Exact approved Supabase Edge Function slug
        required: true
        type: string
permissions:
  contents: read
  issues: read
concurrency:
  group: sandy-source-audit-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandy-source-audit
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate request
        env:
          ISSUE: ${{ inputs.issue_number }}
          SLUG: ${{ inputs.edge_function }}
          SOURCE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,5}$ ]] || exit 1
          [[ "$SLUG" =~ ^sandy-[a-z0-9-]{1,80}$ ]] || exit 1
          test -n "$SOURCE_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN in protected environment"; exit 1; }
      - name: Test source audit safety contracts
        run: |
          python3 -m unittest discover -s scripts/sandy -p 'test_source_audit_manifest.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_reconcile_source_audit.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_source_reconciliation_handoff.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_source_reconciliation_review_packet.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_source_publication_gate.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_source_diff_summary.py' -v
          python3 -m unittest discover -s scripts/sandy -p 'test_source_review_gate.py' -v
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Retrieve source into isolated review directory
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SLUG: ${{ inputs.edge_function }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sandy-audit
          cd /tmp/sandy-audit
          supabase functions download "$SLUG" --project-ref zmqlyygzqoidkcwdysok --use-api
          test -s "supabase/functions/$SLUG/index.ts" || { echo "::error::Missing downloaded entrypoint"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/sandy/source_audit_manifest.py" "supabase/functions/$SLUG" > manifest.json
      - name: Compare downloaded metadata to checked-out repository source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sandy/reconcile_source_audit.py /tmp/sandy-audit/manifest.json "$GITHUB_WORKSPACE" > /tmp/sandy-audit/comparison.json
      - name: Record metadata-only review evidence on engineering issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: python3 scripts/sandy/source_reconciliation_handoff.py /tmp/sandy-audit/comparison.json
      - name: Create review packet without production source
        env:
          ISSUE: ${{ inputs.issue_number }}
        run: |
          python3 scripts/sandy/source_reconciliation_review_packet.py /tmp/sandy-audit/comparison.json "$ISSUE" "$GITHUB_RUN_ID" /tmp/sandy-audit/review-packet.json
      - name: Screen source for sensitive content before any future publication
        env:
          SLUG: ${{ inputs.edge_function }}
        run: |
          python3 scripts/sandy/source_publication_gate.py "/tmp/sandy-audit/supabase/functions/$SLUG" /tmp/sandy-audit/comparison.json > /tmp/sandy-audit/publication-screen.json
      - name: Prepare source-free diff statistics for independent review
        env:
          SLUG: ${{ inputs.edge_function }}
        run: |
          python3 scripts/sandy/source_diff_summary.py "/tmp/sandy-audit/supabase/functions/$SLUG" "$GITHUB_WORKSPACE/supabase/functions/$SLUG" /tmp/sandy-audit/comparison.json /tmp/sandy-audit/publication-screen.json > /tmp/sandy-audit/diff-summary.json
      - name: Record explicit fail-closed publication review status
        run: |
          python3 scripts/sandy/source_review_gate.py /tmp/sandy-audit/manifest.json /tmp/sandy-audit/comparison.json /tmp/sandy-audit/publication-screen.json /tmp/sandy-audit/review-packet.json > /tmp/sandy-audit/publication-review.json
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandy-source-audit-${{ inputs.issue_number }}-${{ github.run_id }}
          path: |
            /tmp/sandy-audit/manifest.json
            /tmp/sandy-audit/comparison.json
            /tmp/sandy-audit/review-packet.json
            /tmp/sandy-audit/publication-screen.json
            /tmp/sandy-audit/diff-summary.json
            /tmp/sandy-audit/publication-review.json
          retention-days: 1
          if-no-files-found: error
