name: Activate approved hosting account API
on:
  workflow_run:
    workflows: [Sandy engineering regression checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, deploy, reconcile, rollback]
        default: preflight
      owner_change_id:
        description: Exact authenticated Owner activation record
        required: false
      artifact:
        description: Private recovery artifact for rollback
        required: false
permissions:
  contents: read
  checks: read
concurrency:
  group: sandy-provider-operation-api-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'ausstyle/web-staging'))
    environment: sandy-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate bounded activation
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python -m unittest scripts/sandy/test_hosting_api_activation.py -v
      - name: Execute selected protected mode
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_run' && 'auto' || inputs.mode }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OWNER_CHANGE: ${{ github.event_name == 'workflow_run' && '2ed107d8-07b3-4458-a4f7-e03739214b6c' || inputs.owner_change_id }}
          ARTIFACT: ${{ inputs.artifact }}
        run: python scripts/sandy/release_hosting_api_activation.py --mode "$MODE" --owner-change-id "$OWNER_CHANGE" --artifact "$ARTIFACT"
