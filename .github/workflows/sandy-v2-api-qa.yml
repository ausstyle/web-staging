name: Sandy V2 autonomous API QA
# Fresh production QA regression.
# New manual production smoke.
# Fresh production test.
# Verify v49 persisted clock/task independent audit data.
# Verify explicit budget-exhaustion response on v50.
# Capacity-aligned hourly scheduling; preserve independent per-run evidence.
# Verify intelligence capture INSERT and SELECT privileges repaired 2026-10-18.
# Final v44 evidence and Evolution intake regression.
# Validate Examiner intelligence assurance evidence receipts on v33.
# Run dynamic QA with newly generated Astra suite.
# Verify Examiner-to-Evolution delivery after diagnosis table permission repair.
# Independent Evolution handoff receipt verification on v28.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandy-v2-api-qa.yml'
      - 'supabase/functions/sandy-agent-runtime/**'
      - 'supabase/functions/sandy-engineering-oidc-ingest/**'
      - 'scripts/sandy/test_v2_autonomous_api_qa.py'
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sandy-v2-autonomous-api-qa
  cancel-in-progress: false
jobs:
  issue-real-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call Sandy QA with short-lived GitHub identity (no shared secrets)
        shell: bash
        env:
          PROJECT: zmqlyygzqoidkcwdysok
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token unavailable}"
          AUDIENCE="sandy-engineering-outcomes-${PROJECT}"
          CLAIM_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          ID_TOKEN="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${CLAIM_URL}" | jq -er '.value')"
          test -n "${ID_TOKEN}"
          RESPONSE="$(curl --silent --show-error --max-time 250 \
            -X POST "https://${PROJECT}.supabase.co/functions/v1/sandy-engineering-oidc-ingest" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"operation":"v2_api_qa"}')"
          echo "${RESPONSE}" | jq -e '{ok,reason,run_key,attempted,passed,failed,reviews,results}'
          # A transport-level ok is not a successful Examiner test.
          # Fail closed on skipped/idempotent runs and missing evidence.
          echo "${RESPONSE}" | jq -e '
            .ok == true and
            (.attempted | type == "number" and . >= 1) and
            (.passed | type == "number" and . >= 0) and
            (.failed | type == "number" and . >= 0) and
            (.passed + .failed <= .attempted) and
            (.results | type == "array" and length >= 1)
          ' >/dev/null || {
            echo "::error::Examiner API QA produced no verifiable executions or invalid counters; refusing false success."
            exit 1
          }
