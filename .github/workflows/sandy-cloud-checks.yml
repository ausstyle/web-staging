name: Sandy Cloud integrity checks
on:
  pull_request:
    paths:
      - 'packages/sandy-cloud/**'
      - 'docs/sandy-cloud/**'
      - '.github/workflows/sandy-cloud-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: deno fmt --check packages/sandy-cloud
      - run: deno check packages/sandy-cloud/fixture_server.ts packages/sandy-cloud/sync.ts packages/sandy-cloud/backup.ts packages/sandy-cloud/postgres/commit.ts
      - run: deno test --allow-read=packages/sandy-cloud,/tmp --allow-write=/tmp packages/sandy-cloud/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python packages/sandy-cloud/run_browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-cloud-browser-${{ github.run_id }}
          path: /tmp/sandy-cloud-evidence/
          retention-days: 14
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/sandy-cloud-pg --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node --experimental-transform-types packages/sandy-cloud/postgres/verify.mts /tmp/sandy-cloud-pg/node_modules/@electric-sql/pglite/dist/index.js
      - run: node --experimental-transform-types packages/sandy-cloud/postgres/verify_bindings.mts /tmp/sandy-cloud-pg/node_modules/@electric-sql/pglite/dist/index.js
      - name: Read pinned Runtime source for isolated composition test
        run: |
          git fetch --no-tags origin ab2cfa4fb29fc5ba72a72fb77c0665fd1181ae55
          mkdir -p /tmp/sandy-cloud-runtime-source
          git archive ab2cfa4fb29fc5ba72a72fb77c0665fd1181ae55 packages/sandy-runtime-custody/journal.ts packages/sandy-runtime-custody/attestation.ts packages/sandy-runtime-custody/schema.sql | tar -x -C /tmp/sandy-cloud-runtime-source
      - run: node --experimental-transform-types packages/sandy-cloud/postgres/verify_runtime_scan.mts /tmp/sandy-cloud-pg/node_modules/@electric-sql/pglite/dist/index.js /tmp/sandy-cloud-runtime-source/packages/sandy-runtime-custody
      - run: python3 packages/sandy-cloud/build_release.py --output /tmp/sandy-cloud-release
      - uses: actions/upload-artifact@v4
        with:
          name: sandy-cloud-integration-source-${{ github.sha }}
          path: /tmp/sandy-cloud-release/
          retention-days: 14
