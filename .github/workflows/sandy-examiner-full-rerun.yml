name: Sandy Examiner full assessment rerun
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Fixed protected Runtime acceptance action; no customer or target selectors'
        type: choice
        options: [v2_full_examiner_rerun, runtime_email_shadow_fixture]
        default: v2_full_examiner_rerun
        required: true
      focused_regression:
        description: 'Only fixed failed/review clock/task/evidence cases; not full acceptance'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: sandy-examiner-manual-full-rerun
  cancel-in-progress: false
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Launch authenticated full Examiner assessment
        env:
          PROJECT: zmqlyygzqoidkcwdysok
          ACCEPTANCE_OPERATION: ${{ inputs.operation }}
          FOCUSED_REGRESSION: ${{ inputs.focused_regression }}
        shell: bash
        run: |
          set -euo pipefail
          AUDIENCE="sandy-engineering-outcomes-${PROJECT}"
          CLAIM_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          TOKEN="$(curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${CLAIM_URL}" | jq -er '.value')"
          PAYLOAD="$(jq -cn --arg operation "${ACCEPTANCE_OPERATION}" --argjson focused "${FOCUSED_REGRESSION}" 'if $operation == "v2_full_examiner_rerun" then {operation:$operation,focused_regression:$focused} else {operation:$operation} end')"
          RESPONSE="$(curl --fail --silent --show-error --max-time 140 -X POST "https://${PROJECT}.supabase.co/functions/v1/sandy-engineering-oidc-ingest" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data "${PAYLOAD}")"
          echo "${RESPONSE}" | jq '{ok,run_key,status,mode,operation,worker_http_status,source_message_id,candidate_ready,sent,synthetic_target,thread_review_required,reason}'
          if [[ "${ACCEPTANCE_OPERATION}" == 'v2_full_examiner_rerun' ]]; then
            echo "${RESPONSE}" | jq -e --argjson focused "${FOCUSED_REGRESSION}" '.ok == true and .status == "running" and .thread_review_required == ($focused|not) and .synthetic_target == (if $focused then 3 else 12 end)' >/dev/null
          else
            echo "${RESPONSE}" | jq -e '.ok == true and .operation == "runtime_email_shadow_fixture" and .worker_http_status == 200 and .candidate_ready == true and .sent == false' >/dev/null
          fi
          printf '::notice title=Examiner acceptance launch::%s\n' "$(echo "${RESPONSE}" | jq -c '{ok,run_key,status,mode,operation,worker_http_status,source_message_id,candidate_ready,sent,synthetic_target,thread_review_required,reason}')"
