name: Sandy hosting approval visibility checks
on:
  pull_request:
    paths:
      - 'sandy/controller/hosting-account-approval*'
      - 'sandy/controller/index.html'
      - 'scripts/sandy/check_hosting_approval_browser.py'
      - 'scripts/sandy/fixtures/hosting-account-approval-record.json'
      - '.github/workflows/sandy-hosting-approval-check.yml'
permissions:
  contents: read
jobs:
  approval-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact request and genuine audit boundary
        run: node --test sandy/controller/hosting-account-approval.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test full Controller exact-record Owner and non-Owner views
        run: python scripts/sandy/check_hosting_approval_browser.py
