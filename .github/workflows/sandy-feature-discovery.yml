name: Sandy autonomous feature discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandy-feature-discovery.yml'
      - 'scripts/sandy/run_feature_discovery.py'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: sandy-feature-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: ${{ github.repository == 'ausstyle/web-staging' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify feature-discovery contracts
        run: python3 -m unittest discover -s scripts/sandy -p 'test_feature_discovery*.py' -v
      - name: Discover features and persist verified engineering issue handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sandy/run_feature_discovery.py
