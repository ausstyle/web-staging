name: Sandy engineering regression checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sandy/**'
      - 'docs/sandy/**'
      - '.github/workflows/sandy-*.yml'
      - 'supabase/functions/sandy-feature-discovery/**'
      - 'supabase/functions/sandy-engineering-oidc-ingest/**'
      - 'supabase/functions/sandy-repository-release-verifier/**'
  push:
    branches: [main]
    paths:
      - 'scripts/sandy/**'
      - 'docs/sandy/**'
      - '.github/workflows/sandy-*.yml'
      - 'supabase/functions/sandy-feature-discovery/**'
      - 'supabase/functions/sandy-engineering-oidc-ingest/**'
      - 'supabase/functions/sandy-repository-release-verifier/**'
permissions:
  contents: read
jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed offline contract dependencies
        run: python -m pip install -r scripts/sandy/testing/offline-requirements.txt
      - name: Run Sandy offline contract tests
        run: python3 -m unittest discover -s scripts/sandy -p 'test_*.py' -v
      - name: Verify Python syntax
        run: python3 -m compileall -q scripts/sandy
      - name: Verify feature-discovery risk policy syntax
        run: node --check supabase/functions/sandy-feature-discovery/risk-policy.js
