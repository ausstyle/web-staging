name: Recover WAM Monthly NTA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ocr_wam_nta.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install requests pymupdf pillow pytesseract
      - run: python scripts/ocr_wam_nta.py
      - name: Upload candidate report artifact
        uses: actions/upload-artifact@v4
        with:
          name: wam-nta-ocr-candidates
          path: asx-atlas/analysis/wam-nta-ocr-candidates.csv
          retention-days: 30
      - name: Commit candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asx-atlas/analysis/wam-nta-ocr-candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "Automated WAM missing NTA OCR candidate audit"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              sleep 3
            done
          fi
