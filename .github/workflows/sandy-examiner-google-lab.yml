name: Sandy Examiner Google Lab Verification
# Read-only OAuth/provider, Gmail, Drive and Calendar metadata audit; triggered after v17 deployment.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandy-examiner-google-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sandy-examiner-google-lab
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify connected test identity via signed GitHub OIDC
        shell: bash
        env:
          PROJECT: zmqlyygzqoidkcwdysok
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC unavailable}"
          AUDIENCE="sandy-engineering-outcomes-${PROJECT}"
          CLAIM_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          ID_TOKEN="$(curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${CLAIM_URL}" | jq -er .value)"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 100 -X POST "https://${PROJECT}.supabase.co/functions/v1/sandy-engineering-oidc-ingest" -H "Authorization: Bearer ${ID_TOKEN}" -H "Content-Type: application/json" --data '{"operation":"examiner_google_lab_verify"}')"
          echo "${RESPONSE}" | jq -e '{ok,verified,services,read_only_execution_tested,lab_enabled}'
          echo "${RESPONSE}" | jq -e '.ok == true' >/dev/null
