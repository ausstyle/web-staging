name: Sandy engineering-control repair
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [ci_only, reconcile, diagnose_access, deploy]
        default: ci_only
        required: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Latest source regression and isolated SQL checks
        run: |
          deno test --allow-read --allow-env supabase/functions/_shared/sandy-executive/ supabase/functions/sandy-engineering-control/routine_delegation_test.ts supabase/functions/sandy-engineering-control/autonomous_release_test.ts supabase/functions/sandy-engineering-runtime/index_test.ts supabase/functions/sandy-engineering-control/workload_test.ts sandy/controller/session-transport.test.mjs sandy/controller/engineering-releases.test.mjs sandy/controller/authorized-deadline-action.test.mjs sandy/controller/authorized-auth-repair-action.test.mjs sandy/controller/amendment-b-approval.test.mjs
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 -m unittest scripts/sandy/test_delegated_runtime_release.py scripts/sandy/test_owner_repair_release.py scripts/sandy/test_owner_repair_diagnostics.py scripts/sandy/test_management_access_diagnostics.py
          npm install --prefix "$RUNNER_TEMP/sandy-pg" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          node scripts/sandy/test_owner_delegation_postgres.mjs "$RUNNER_TEMP/sandy-pg/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/sandy/test_autonomous_delegation_postgres.mjs "$RUNNER_TEMP/sandy-pg/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Verify exact approved modules and migration
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 -c 'from release_owner_session_repair import candidate; m,files,sql=candidate(); print("Pinned modules verified:",len(files))'
  deploy:
    concurrency:
      group: sandy-engineering-control-approved-repair
      cancel-in-progress: false
    if: ${{ inputs.mode == 'deploy' || inputs.mode == 'reconcile' || inputs.mode == 'diagnose_access' }}
    needs: checks
    runs-on: ubuntu-latest
    environment: sandy-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile or release only the genuinely approved repair
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SANDY_REPAIR_MODE: ${{ inputs.mode }}
        run: |
          test -n "$SANDY_SUPABASE_MANAGEMENT_TOKEN" || { echo 'Missing existing deployment credential'; exit 1; }
          if [ "$SANDY_REPAIR_MODE" = diagnose_access ]; then
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 scripts/sandy/release_owner_session_repair.py --diagnose-access --evidence-dir "$RUNNER_TEMP/sandy-approved-owner-repair"
          elif [ "$SANDY_REPAIR_MODE" = reconcile ]; then
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 scripts/sandy/release_owner_session_repair.py --reconcile --evidence-dir "$RUNNER_TEMP/sandy-approved-owner-repair"
          else
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 scripts/sandy/release_owner_session_repair.py --deploy --evidence-dir "$RUNNER_TEMP/sandy-approved-owner-repair"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: owner-repair-redacted-receipt
          path: |
            ${{ runner.temp }}/sandy-approved-owner-repair/redacted-receipt.json
            ${{ runner.temp }}/sandy-approved-owner-repair/redacted-failure.json
            ${{ runner.temp }}/sandy-approved-owner-repair/redacted-reconciliation.json
            ${{ runner.temp }}/sandy-approved-owner-repair/redacted-access.json
          if-no-files-found: ignore
