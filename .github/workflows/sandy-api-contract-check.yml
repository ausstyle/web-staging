name: Sandy API contract checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/sandy-operation-api/**'
      - 'supabase/functions/sandy-api-mcp/**'
      - 'supabase/functions/sandy-deployment-api/**'
      - 'supabase/functions/sandy-provider-read-api/**'
      - 'supabase/functions/sandy-provider-operation-api/**'
      - 'supabase/functions/sandy-provider-gap-api/**'
      - 'supabase/migrations/20261023160000_sandy_missing_supabase_contracts.sql'
      - 'scripts/sandy/*supabase*'
      - 'supabase/functions/sandy-mission-runner/**'
      - 'supabase/functions/sandy-auto-improve/**'
      - 'supabase/functions/_shared/sandy-agent-operations/**'
      - 'supabase/functions/_shared/sandy_finish_receipt*'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - 'supabase/functions/sandy-engineering-control/gcp_admin_read*'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'scripts/sandy/verify_gcp_admin_candidate*'
      - 'scripts/sandy/release_gcp_admin_read.py'
      - 'scripts/sandy/release_admin_delegation.py'
      - '.github/workflows/sandy-admin-delegation-release.yml'
      - '.github/workflows/sandy-gcp-admin-read-release.yml'
      - '.github/workflows/sandy-gcp-admin-acceptance.yml'
      - 'docs/sandy-engineering/evaluations/gcp-admin-read-release.json'
      - 'scripts/sandy/probe_mcp_management*'
      - 'scripts/sandy/existing_mcp_candidate*'
      - '.github/workflows/sandy-engineering-mcp-acceptance.yml'
      - 'supabase/functions/sandy-vm-protocol-api/**'
      - 'supabase/functions/sandy-computer-worker/**'
      - 'supabase/functions/sandy-master-computer/**'
      - 'scripts/sandy/*computer*'
      - 'scripts/sandy/fixtures/computer-worker-v58.ts'
      - '.github/workflows/sandy-computer-eligibility-release.yml'
      - 'scripts/sandy/testing/**'
      - 'scripts/sandy/*api*'
      - 'scripts/sandy/iap_admin_repair.py'
      - 'scripts/sandy/test_iap_admin_repair.py'
      - 'scripts/sandy/*iap*'
      - 'supabase/migrations/20261024001000_sandy_iap_repair_authorization.sql'
      - 'sandy/app/engineering-delegation.html'
      - '.github/workflows/sandy-iap-authorization-release.yml'
      - '.github/workflows/sandy-api-contract-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sandy-operation-api/**'
      - 'supabase/functions/sandy-api-mcp/**'
      - 'supabase/functions/sandy-deployment-api/**'
      - 'supabase/functions/sandy-provider-read-api/**'
      - 'supabase/functions/sandy-provider-operation-api/**'
      - 'supabase/functions/sandy-provider-gap-api/**'
      - 'supabase/migrations/20261023160000_sandy_missing_supabase_contracts.sql'
      - 'scripts/sandy/*supabase*'
      - 'supabase/functions/sandy-mission-runner/**'
      - 'supabase/functions/sandy-auto-improve/**'
      - 'supabase/functions/_shared/sandy-agent-operations/**'
      - 'supabase/functions/_shared/sandy_finish_receipt*'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - 'supabase/functions/sandy-engineering-control/gcp_admin_read*'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'scripts/sandy/verify_gcp_admin_candidate*'
      - 'scripts/sandy/release_gcp_admin_read.py'
      - 'scripts/sandy/release_admin_delegation.py'
      - '.github/workflows/sandy-admin-delegation-release.yml'
      - '.github/workflows/sandy-gcp-admin-read-release.yml'
      - '.github/workflows/sandy-gcp-admin-acceptance.yml'
      - 'docs/sandy-engineering/evaluations/gcp-admin-read-release.json'
      - 'scripts/sandy/probe_mcp_management*'
      - 'scripts/sandy/existing_mcp_candidate*'
      - '.github/workflows/sandy-engineering-mcp-acceptance.yml'
      - 'supabase/functions/sandy-vm-protocol-api/**'
      - 'supabase/functions/sandy-computer-worker/**'
      - 'supabase/functions/sandy-master-computer/**'
      - 'scripts/sandy/*computer*'
      - 'scripts/sandy/fixtures/computer-worker-v58.ts'
      - '.github/workflows/sandy-computer-eligibility-release.yml'
      - 'scripts/sandy/testing/**'
      - 'scripts/sandy/*api*'
      - 'scripts/sandy/iap_admin_repair.py'
      - 'scripts/sandy/test_iap_admin_repair.py'
      - 'scripts/sandy/*iap*'
      - 'supabase/migrations/20261024001000_sandy_iap_repair_authorization.sql'
      - 'sandy/app/engineering-delegation.html'
      - '.github/workflows/sandy-iap-authorization-release.yml'
      - '.github/workflows/sandy-api-contract-check.yml'
permissions:
  contents: read
jobs:
  provider-response-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test provider projection, credentials and response boundaries
        run: deno test --allow-env --allow-read supabase/functions/sandy-provider-operation-api/index_test.ts
  supabase-gap-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test exact contracts, provider credential boundaries and uncertain outcomes
        run: deno test supabase/functions/sandy-provider-gap-api/
      - name: Test creation custody in isolated PostgreSQL
        run: deno test --allow-read scripts/sandy/test_missing_supabase_custody.ts
      - name: Check reproducible closed registry metadata
        run: |
          deno run --allow-read --allow-write=supabase/functions/sandy-provider-gap-api/gateway_manifest.json,supabase/migrations/20261023160000_sandy_missing_supabase_contracts.sql scripts/sandy/build_supabase_missing_contracts.ts
          git diff --exit-code -- supabase/functions/sandy-provider-gap-api/gateway_manifest.json supabase/migrations/20261023160000_sandy_missing_supabase_contracts.sql
  api-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test API, MCP and deployment evidence boundaries
        run: |
          set +e
          deno test --import-map=scripts/sandy/testing/edge_types_import_map.json --allow-read=supabase/functions/sandy-operation-api/registry_schema_ajv_reference_test_support.ts,supabase/functions/sandy-mission-runner/legacy-policy-source.json,supabase/functions/sandy-auto-improve/legacy-policy-source.json supabase/functions/sandy-operation-api/ supabase/functions/sandy-api-mcp/ supabase/functions/sandy-deployment-api/ supabase/functions/sandy-provider-read-api/ supabase/functions/sandy-mission-runner/ supabase/functions/sandy-auto-improve/ supabase/functions/_shared/sandy-agent-operations/worker_mission_planning_profiles_test.ts supabase/functions/_shared/sandy_finish_receipt_test.ts supabase/functions/_shared/sandy_engineering_session_test.ts supabase/functions/_shared/sandy_engineering_session_client_test.ts supabase/functions/sandy-engineering-runtime/ supabase/functions/sandy-engineering-control/gcp_admin_read_test.ts scripts/sandy/verify_mcp_candidate_test.ts scripts/sandy/verify_gcp_admin_candidate_test.ts scripts/sandy/probe_mcp_management_test.ts scripts/sandy/existing_mcp_candidate_test.ts > "$RUNNER_TEMP/sandy-api-deno.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/sandy-api-deno.log"
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PYERROR'
          import os,pathlib,re
          # Isolated contract tests have no production credentials. Retain a
          # bounded error annotation when the signed Actions log host is blocked.
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'sandy-api-deno.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          start=text.find(' ERRORS ')
          detail=(text[start:] if start>=0 else text[-4000:])[:4000]
          detail=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=API contract regression failure::'+detail)
          PYERROR
          fi
          exit "$test_status"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Test inventory and read-only production inspection
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set +e
          python -m unittest discover -s scripts/sandy -p 'test_*api*.py' -v > "$RUNNER_TEMP/sandy-api-python.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/sandy-api-python.log"
          if [ "$test_status" -ne 0 ]; then
            SANDY_TEST_LOG="$RUNNER_TEMP/sandy-api-python.log" python - <<'PYTHON'
          import os, re
          from pathlib import Path
          log=Path(os.environ['SANDY_TEST_LOG']).read_text()
          failures=list(re.finditer(r'(?m)^(?:ERROR|FAIL): .+$',log))
          for i,match in enumerate(failures):
              end=failures[i+1].start() if i+1<len(failures) else len(log)
              detail=log[match.start():end].split('\nRan ',1)[0][:3000]
              detail=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=API Python regression failure::'+detail)
          PYTHON
          fi
          exit "$test_status"
  vm-protocol-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test bounded IAP repair and graphical session eligibility
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts/sandy
        run: |
          python3 -m unittest scripts/sandy/test_iap_admin_repair.py scripts/sandy/test_computer_eligibility_release.py -v
          deno test --allow-read scripts/sandy/test_iap_repair_authorization.ts
          deno test --allow-read scripts/sandy/test_iap_repair_custody.ts
          deno test supabase/functions/sandy-engineering-control/iap_repair_test.ts
          deno test supabase/functions/sandy-engineering-control/iap_repair_jobs_test.ts
          python3 -m unittest scripts/sandy/test_iap_transport_source.py -v
          python3 -m unittest scripts/sandy/test_iap_runtime_binding.py -v
          python3 -m unittest scripts/sandy/test_iap_transport_release.py -v
          deno test scripts/sandy/verify_iap_closed_candidate_test.ts
          deno check scripts/sandy/submit_iap_repair_proposal.ts
          deno check supabase/functions/sandy-computer-worker/eligibility.ts
          deno test --no-check --allow-read=supabase/functions/sandy-computer-worker/index.ts supabase/functions/sandy-computer-worker/eligibility_test.ts
          deno test supabase/functions/_shared/sandy-agent-operations/worker_computer_lifecycle_test.ts
          deno test supabase/functions/sandy-master-computer/index_test.ts
      - name: Test native protocols against isolated loopback fixtures
        run: |
          set -euo pipefail
          if deno test \
            --import-map=scripts/sandy/testing/edge_types_import_map.json \
            --allow-read=/tmp --allow-write=/tmp \
            --allow-run=openssl,deno --allow-net=127.0.0.1 \
            --allow-env=WS_NO_BUFFER_UTIL,WS_NO_UTF_8_VALIDATE \
            supabase/functions/sandy-vm-protocol-api/ \
            > "$RUNNER_TEMP/sandy-vm-contract.log" 2>&1; then
            cat "$RUNNER_TEMP/sandy-vm-contract.log"
          else
            cat "$RUNNER_TEMP/sandy-vm-contract.log"
            # These isolated fixture tests have no production credentials.
            # Keep a bounded failure annotation available through the normal
            # GitHub API when the signed Actions log host is unreachable.
            python3 - <<'PYERROR'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sandy-vm-contract.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)[-3000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Isolated VM protocol regression::' + escaped)
          PYERROR
            exit 1
          fi
      - name: Check closed contract compiler invariants
        run: python3 supabase/functions/sandy-vm-protocol-api/compiler_test.py
