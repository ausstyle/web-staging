name: Sandy API contract checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/sandy-operation-api/**'
      - 'supabase/functions/sandy-api-mcp/**'
      - 'supabase/functions/sandy-deployment-api/**'
      - 'supabase/functions/sandy-provider-read-api/**'
      - 'supabase/functions/sandy-mission-runner/**'
      - 'supabase/functions/sandy-auto-improve/**'
      - 'supabase/functions/_shared/sandy-agent-operations/**'
      - 'supabase/functions/_shared/sandy_finish_receipt*'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'supabase/functions/sandy-vm-protocol-api/**'
      - 'scripts/sandy/testing/**'
      - 'scripts/sandy/*api*'
      - '.github/workflows/sandy-api-contract-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sandy-operation-api/**'
      - 'supabase/functions/sandy-api-mcp/**'
      - 'supabase/functions/sandy-deployment-api/**'
      - 'supabase/functions/sandy-provider-read-api/**'
      - 'supabase/functions/sandy-mission-runner/**'
      - 'supabase/functions/sandy-auto-improve/**'
      - 'supabase/functions/_shared/sandy-agent-operations/**'
      - 'supabase/functions/_shared/sandy_finish_receipt*'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'supabase/functions/sandy-vm-protocol-api/**'
      - 'scripts/sandy/testing/**'
      - 'scripts/sandy/*api*'
      - '.github/workflows/sandy-api-contract-check.yml'
permissions:
  contents: read
jobs:
  api-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test API, MCP and deployment evidence boundaries
        run: >-
          deno test
          --import-map=scripts/sandy/testing/edge_types_import_map.json
          --allow-read=supabase/functions/sandy-operation-api/registry_schema_ajv_reference_test_support.ts,supabase/functions/sandy-mission-runner/legacy-policy-source.json,supabase/functions/sandy-auto-improve/legacy-policy-source.json
          supabase/functions/sandy-operation-api/
          supabase/functions/sandy-api-mcp/
          supabase/functions/sandy-deployment-api/
          supabase/functions/sandy-provider-read-api/
          supabase/functions/sandy-mission-runner/
          supabase/functions/sandy-auto-improve/
          supabase/functions/_shared/sandy-agent-operations/worker_mission_planning_profiles_test.ts
          supabase/functions/_shared/sandy_finish_receipt_test.ts
          supabase/functions/_shared/sandy_engineering_session_test.ts
          supabase/functions/_shared/sandy_engineering_session_client_test.ts
          supabase/functions/sandy-engineering-runtime/
          scripts/sandy/verify_mcp_candidate_test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Test inventory and read-only production inspection
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set +e
          python -m unittest discover -s scripts/sandy -p 'test_*api*.py' -v > "$RUNNER_TEMP/sandy-api-python.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/sandy-api-python.log"
          if [ "$test_status" -ne 0 ]; then
            SANDY_TEST_LOG="$RUNNER_TEMP/sandy-api-python.log" python - <<'PYTHON'
          import os, re
          from pathlib import Path
          log=Path(os.environ['SANDY_TEST_LOG']).read_text()
          failures=list(re.finditer(r'(?m)^(?:ERROR|FAIL): .+$',log))
          for i,match in enumerate(failures):
              end=failures[i+1].start() if i+1<len(failures) else len(log)
              detail=log[match.start():end].split('\nRan ',1)[0][:3000]
              detail=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=API Python regression failure::'+detail)
          PYTHON
          fi
          exit "$test_status"
  vm-protocol-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test native protocols against isolated loopback fixtures
        run: |
          set -euo pipefail
          if deno test \
            --import-map=scripts/sandy/testing/edge_types_import_map.json \
            --allow-read=/tmp --allow-write=/tmp \
            --allow-run=openssl --allow-net=127.0.0.1 \
            --allow-env=WS_NO_BUFFER_UTIL,WS_NO_UTF_8_VALIDATE \
            supabase/functions/sandy-vm-protocol-api/ \
            > "$RUNNER_TEMP/sandy-vm-contract.log" 2>&1; then
            cat "$RUNNER_TEMP/sandy-vm-contract.log"
          else
            cat "$RUNNER_TEMP/sandy-vm-contract.log"
            # These isolated fixture tests have no production credentials.
            # Keep a bounded failure annotation available through the normal
            # GitHub API when the signed Actions log host is unreachable.
            python3 - <<'PYERROR'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sandy-vm-contract.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)[-3000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Isolated VM protocol regression::' + escaped)
          PYERROR
            exit 1
          fi
      - name: Check closed contract compiler invariants
        run: python3 supabase/functions/sandy-vm-protocol-api/compiler_test.py
