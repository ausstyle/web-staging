name: Sandy credential fixture probe
run-name: sandy-credential-fixture-${{ inputs.rotation_id }}
on:
  workflow_dispatch:
    inputs:
      rotation_id:
        description: Approved Sandy rotation UUID
        required: true
        type: string
      challenge:
        description: Single-use verification UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify_fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - id: proof
        name: Compute the fixed fixture proof
        env:
          ROTATION_ID: ${{ inputs.rotation_id }}
          CHALLENGE: ${{ inputs.challenge }}
          FIXTURE_SECRET: ${{ secrets.SANDY_ROTATION_TEST_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, hmac, os, uuid
          rotation = str(uuid.UUID(os.environ['ROTATION_ID']))
          challenge = str(uuid.UUID(os.environ['CHALLENGE']))
          material = os.environ.get('FIXTURE_SECRET', '')
          if not material:
              raise SystemExit('fixture_secret_unavailable')
          message = f'sandy-credential-fixture-v1\n{rotation}\n{challenge}'.encode()
          digest = hmac.new(material.encode(), message, hashlib.sha256).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
          PY
      - name: sandy-proof-${{ steps.proof.outputs.digest }}
        run: 'true'
      - name: sandy-secret-SANDY_ROTATION_TEST_SECRET
        run: 'true'
