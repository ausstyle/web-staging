name: Verify Existing Sandy IAP Candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read provider routing diagnostics only, or run separately authorized acceptance after its blocker is resolved
        type: choice
        required: true
        default: diagnostics
        options: [diagnostics, acceptance]
  pull_request:
    paths:
      - '.github/workflows/sandy-iap-existing-candidate-acceptance.yml'
      - 'scripts/sandy/reconcile_existing_iap_candidate.py'
      - 'scripts/sandy/diagnose_iap_routing.py'
      - 'scripts/sandy/test_existing_iap_candidate.py'
      - 'scripts/sandy/verify_iap_closed_candidate*'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sandy-iap-existing-check-{0}', github.event.pull_request.number) || 'sandy-engineering-mcp-deploy' }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/sandy python3 -m unittest scripts/sandy/test_existing_iap_candidate.py scripts/sandy/test_iap_transport_release.py scripts/sandy/test_iap_runtime_binding.py -v
          deno test scripts/sandy/verify_iap_closed_candidate_test.ts
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: checks
    runs-on: ubuntu-latest
    environment: sandy-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable original deployment provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ausstyle/web-staging/actions/runs/40049214245 > "$RUNNER_TEMP/prior-run.json"
          gh api repos/ausstyle/web-staging/actions/runs/40047740407 > "$RUNNER_TEMP/original-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'original-run.json').read_text())
          assert r['head_sha']=='9ca456d2705c649388d6a12a714a648e6ebea472' and r['run_attempt']==1 and r['status']=='completed'
          assert r['path']=='.github/workflows/sandy-engineering-mcp-deploy.yml' and r['repository']['full_name']=='ausstyle/web-staging'
          prior=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'prior-run.json').read_text())
          assert prior['head_sha']=='0b6d5a91f11348d95d3ca540075e257288e3948a' and prior['run_attempt']==1 and prior['status']=='completed'
          assert prior['path']=='.github/workflows/sandy-iap-existing-candidate-acceptance.yml' and prior['repository']['full_name']=='ausstyle/web-staging'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ausstyle/web-staging
          run-id: 40047740407
          name: sandy-mcp-release-9ca456d2705c649388d6a12a714a648e6ebea472
          path: ${{ runner.temp }}/original-iap-candidate
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.SANDY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SANDY_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Independently reconcile the same candidate, traffic, source, identity, bindings and installed controls
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
        run: >-
          python3 scripts/sandy/reconcile_existing_iap_candidate.py
          --original-dir "$RUNNER_TEMP/original-iap-candidate"
          --output-dir "$RUNNER_TEMP/iap-existing-acceptance"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'diagnostics' }}
        with:
          github-token: ${{ github.token }}
          repository: ausstyle/web-staging
          run-id: 40049214245
          name: sandy-iap-existing-acceptance-40049214245
          path: ${{ runner.temp }}/prior-iap-acceptance
      - name: Read existing ingress and routing metadata and recover previous final proof without HTTP requests
        if: ${{ inputs.mode == 'diagnostics' }}
        run: >-
          python3 scripts/sandy/diagnose_iap_routing.py
          --prior-dir "$RUNNER_TEMP/prior-iap-acceptance"
          --output-dir "$RUNNER_TEMP/iap-existing-acceptance"
      - name: Diagnose health and verify normal authenticated denial only if healthy
        if: ${{ inputs.mode == 'acceptance' }}
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          SANDY_IAP_ACCEPTANCE_SOURCE_COMMIT: 9ca456d2705c649388d6a12a714a648e6ebea472
        run: >-
          deno run --allow-env --allow-net --allow-read --allow-write
          scripts/sandy/verify_iap_closed_candidate.ts
          "$RUNNER_TEMP/iap-existing-acceptance"
          "$RUNNER_TEMP/iap-existing-acceptance/iap-closed-acceptance.json"
      - name: Always independently recheck original traffic and both tags, even if health or acceptance fails
        if: ${{ always() && steps.auth.outcome == 'success' }}
        run: >-
          python3 scripts/sandy/reconcile_existing_iap_candidate.py
          --original-dir "$RUNNER_TEMP/original-iap-candidate"
          --output-dir "$RUNNER_TEMP/iap-existing-acceptance" --final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-iap-existing-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/iap-existing-acceptance/
