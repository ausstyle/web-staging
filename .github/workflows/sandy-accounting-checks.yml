name: Sandy Accounting integrity checks
on:
  pull_request:
    paths:
      - 'packages/sandy-accounting/**'
      - 'docs/sandy-accounting/**'
      - 'docs/sandy-engineering/tasks/SANDY-ENG-0013-sandy-accounting.md'
      - '.github/workflows/sandy-accounting-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/sandy-accounting --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix packages/sandy-accounting
      - run: npm test --prefix packages/sandy-accounting
      - run: python3 packages/sandy-accounting/scope_register.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 packages/sandy-accounting/browser_test.py
      - run: python3 packages/sandy-accounting/build_release.py /tmp/sandy-accounting-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-accounting-synthetic-${{ github.sha }}
          path: |
            /tmp/sandy-accounting-browser-evidence/
            /tmp/sandy-accounting-release/
          retention-days: 14
