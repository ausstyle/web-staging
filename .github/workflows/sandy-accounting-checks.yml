name: Sandy Accounting integrity checks
on:
  pull_request:
    paths:
      - 'packages/sandy-accounting/**'
      - 'docs/sandy-accounting/**'
      - 'docs/sandy-engineering/tasks/SANDY-ENG-0013-sandy-accounting.md'
      - 'supabase/functions/_shared/sandy_api_protocol.ts'
      - 'supabase/functions/sandy-operation-api/access_policy.ts'
      - '.github/workflows/sandy-accounting-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: sandy_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sandy_accounting_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/sandy-accounting --ignore-scripts --no-audit --no-fund
      - run: node --test packages/sandy-accounting/postgres.test.ts packages/sandy-accounting/postgres_date.test.ts
        env:
          TZ: Australia/Sydney
          ACCOUNTING_TEST_PG_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/sandy_accounting_test
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/sandy-accounting --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix packages/sandy-accounting
      - run: npm test --prefix packages/sandy-accounting
      - run: python3 packages/sandy-accounting/scope_register.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python3 packages/sandy-accounting/browser_test.py
      - run: python3 packages/sandy-accounting/csv_browser_test.py
      - run: python3 packages/sandy-accounting/recovery_browser_test.py
      - run: python3 packages/sandy-accounting/build_release.py /tmp/sandy-accounting-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-accounting-synthetic-${{ github.sha }}
          path: |
            /tmp/sandy-accounting-browser-evidence/
            /tmp/sandy-accounting-csv-browser-evidence/
            /tmp/sandy-accounting-recovery-browser-evidence/
            /tmp/sandy-accounting-release/
          retention-days: 14
