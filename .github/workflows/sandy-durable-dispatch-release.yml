name: Activate existing durable read dispatcher
on:
  workflow_dispatch:
    inputs:
      resume_change_id:
        description: 'Existing timer UUID after trusted runtime transport acceptance; never reinstall migration'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sandy-durable-dispatch-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: sandy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Verify isolated scheduler, credential isolation and cancellation semantics
        run: deno test --no-lock --allow-read scripts/sandy/test_durable_dispatch_schedule.ts
      - name: Activate source-attested existing dispatcher without creating jobs or authority
        if: inputs.resume_change_id == ''
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/sandy/release_durable_dispatch_schedule.py --deploy --evidence-dir "$RUNNER_TEMP/durable-dispatch-install"
      - name: Activate independently verified trusted-runtime transport binding
        if: inputs.resume_change_id != ''
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          SANDY_EXISTING_TIMER_CHANGE: ${{ inputs.resume_change_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/sandy/release_durable_dispatch_schedule.py --activate-bound-transport "$SANDY_EXISTING_TIMER_CHANGE" --evidence-dir "$RUNNER_TEMP/durable-dispatch-install"
      - name: Independently read back migration, private privileges, source and timer
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/sandy/release_durable_dispatch_schedule.py --verify-installed --evidence-dir "$RUNNER_TEMP/durable-dispatch-readback"
      - name: Verify deployed private transport and idle tick without fabricated Owner jobs
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/sandy/release_durable_dispatch_schedule.py --accept-empty-queue --evidence-dir "$RUNNER_TEMP/durable-dispatch-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-dispatch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/durable-dispatch-install/
            ${{ runner.temp }}/durable-dispatch-readback/
            ${{ runner.temp }}/durable-dispatch-acceptance/
          retention-days: 14
