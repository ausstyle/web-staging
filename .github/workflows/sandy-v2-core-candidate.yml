name: Sandy V2 Core candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandy-v2-core-candidate.yml'
      - 'scripts/sandy/prepare_v2_core_candidate.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandy-v2-core-candidate
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile candidate builder with warnings treated as errors
        run: python3 -W error -m py_compile scripts/sandy/prepare_v2_core_candidate.py
      - name: Verify repository Python and risk policy syntax
        run: |
          set -eu
          python3 -m compileall -q scripts/sandy
          node --check supabase/functions/sandy-feature-discovery/risk-policy.js
      - name: Build only audited corrections and preserve V1
        run: python3 scripts/sandy/prepare_v2_core_candidate.py
      - name: Record test provenance and prepare isolated candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/sandy-v2-core/source-commit.txt
          git ls-tree -r HEAD scripts/sandy > artifacts/sandy-v2-core/test-source-tree.txt
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          source=Path.cwd()
          target=Path(os.environ['RUNNER_TEMP'])/'sandy-v2-candidate-contracts'
          shutil.copytree(source,target,ignore=shutil.ignore_patterns('.git','node_modules','artifacts','__pycache__'))
          artifact=source/'artifacts/sandy-v2-core'
          candidate=(artifact/'v2-runtime.ts').read_bytes()
          (target/'supabase/functions/sandy-agent-runtime/index.ts').write_bytes(candidate)
          m=json.loads((artifact/'manifest.json').read_text())
          assert hashlib.sha256((source/'supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['baseline_sha256']
          assert hashlib.sha256((target/'supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['candidate_sha256']
          tests=sorted((source/'scripts/sandy').glob('test_*.py'))
          assert tests,'No offline tests found'
          for f in tests:
              assert f.read_bytes()==(target/'scripts/sandy'/f.name).read_bytes(),'Test assertion source was changed'
          (artifact/'test-provenance.json').write_text(json.dumps({'tests_unchanged':True,'source_commit':os.environ['GITHUB_SHA'],'runtime_under_test':m['candidate_sha256'],'v1_preserved':True,'test_files':[{ 'name':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in tests]},indent=2))
          PY
      - name: Run unchanged Sandy offline contract tests against V2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sandy-v2-candidate-contracts"
          python3 -m unittest discover -s scripts/sandy -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/sandy-v2-core/offline-contract-tests.log"
      - name: Exercise actual candidate validation and workspace code
        shell: bash
        run: |
          set -euo pipefail
          node artifacts/sandy-v2-core/gmail-draft-regression.mjs | tee artifacts/sandy-v2-core/regression-results.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/sandy-v2-core')
          r=json.loads((p/'regression-results.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert r['passed']==r['total']==16,'Incomplete local regression'
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['baseline_sha256'],'V1 source was modified'
          PY
      - name: Preserve candidate, baseline and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: sandy-v2-core-candidate-${{ github.run_id }}
          path: artifacts/sandy-v2-core/
          retention-days: 90
          if-no-files-found: error
  deploy-isolated-candidate:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sandy-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sandy-v2-core-candidate-${{ github.run_id }}
          path: artifacts/sandy-v2-core/
      - name: Respect production environment controls
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          test "$PROJECT_REF" = 'zmqlyygzqoidkcwdysok' || { echo '::error::Production project variable is missing or incorrect'; exit 1; }
          test "$DEPLOYMENT_ENABLED" = 'true' || { echo '::error::Protected production deployment is not enabled'; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Protected deployment credential is unavailable'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: '2.106.0'
      - name: Deploy candidate only; do not switch customer traffic
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase functions deploy --help > /tmp/sandy-functions-deploy-help.txt
          grep -q -- '--no-verify-jwt' /tmp/sandy-functions-deploy-help.txt
          mkdir -p supabase/functions/sandy-agent-runtime-v2
          cp artifacts/sandy-v2-core/v2-runtime.ts supabase/functions/sandy-agent-runtime-v2/index.ts
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/sandy-v2-core')
          m=json.loads((p/'manifest.json').read_text())
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime-v2/index.ts').read_bytes()).hexdigest()==m['candidate_sha256']
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['baseline_sha256']
          PY
          supabase functions deploy sandy-agent-runtime-v2 --project-ref zmqlyygzqoidkcwdysok --no-verify-jwt
      - name: Verify unauthenticated requests are rejected
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --max-time 30 -o /tmp/sandy-v2-auth.json -w '%{http_code}' -X POST 'https://zmqlyygzqoidkcwdysok.supabase.co/functions/v1/sandy-agent-runtime-v2' -H 'Content-Type: application/json' --data '{}')"
          test "$CODE" = '403' || { echo "::error::Expected application auth rejection; got HTTP $CODE"; exit 1; }
          jq -e '.error == "unauthorized"' /tmp/sandy-v2-auth.json
          echo 'Candidate deployed; authenticated workflow acceptance and customer cutover still required.'
