name: Sandy V2 Core candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandy-v2-core-candidate.yml'
      - 'scripts/sandy/prepare_v2_core_candidate.py'
      - 'scripts/sandy/compare_v2_core_regressions.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandy-v2-core-candidate
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile release tooling with warnings treated as errors
        run: python3 -W error -m py_compile scripts/sandy/prepare_v2_core_candidate.py scripts/sandy/compare_v2_core_regressions.py
      - name: Build two audited runtime fixes without altering V1
        run: python3 scripts/sandy/prepare_v2_core_candidate.py
      - name: Exercise actual candidate validation and workspace code
        shell: bash
        run: |
          set -euo pipefail
          node artifacts/sandy-v2-core/gmail-draft-regression.mjs | tee artifacts/sandy-v2-core/regression-results.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/sandy-v2-core')
          r=json.loads((p/'regression-results.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert r['passed']==r['total']==16,'Incomplete Gmail regression'
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['baseline_sha256'],'V1 source changed'
          PY
      - name: Compare full unchanged suites on baseline and candidate
        run: python3 scripts/sandy/compare_v2_core_regressions.py
      - name: Publish accurate candidate review summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/sandy-v2-core')
          r=json.loads((p/'baseline-candidate-comparison.json').read_text())
          assert r['isolated_candidate_regression_check_passed']
          assert r['production_ready'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Isolated V2 candidate, not customer cutover\n\n')
              f.write('Gmail fix regressions: 16/16.\n\n')
              f.write(f"Full suite: {r['candidate_passed']}/{r['tests_per_version']} passed; {r['candidate_failed']} pre-existing Examiner failures remain open.\n\n")
              f.write(f"New candidate regressions: {len(r['new_regressions'])}. Test assertions are unchanged. V1 source is preserved.\n\n")
              for item in r['known_examiner_failures_still_open']:f.write('- Still failing: '+item+'\n')
              f.write('\nProtected approval permits only a separate candidate endpoint. No Core gate is changed or declared passed; production routing remains unchanged.\n')
          PY
      - name: Preserve baseline, candidate and both full test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandy-v2-core-candidate-${{ github.run_id }}
          path: artifacts/sandy-v2-core/
          retention-days: 90
          if-no-files-found: error
  deploy-isolated-candidate:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sandy-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sandy-v2-core-candidate-${{ github.run_id }}
          path: artifacts/sandy-v2-core/
      - name: Respect protected production environment controls
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          test "$PROJECT_REF" = 'zmqlyygzqoidkcwdysok' || { echo '::error::Production project variable is missing or incorrect'; exit 1; }
          test "$DEPLOYMENT_ENABLED" = 'true' || { echo '::error::Protected production deployment is not enabled'; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Protected deployment credential is unavailable'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: '2.106.0'
      - name: Deploy separate candidate without customer traffic switching
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase functions deploy --help > /tmp/sandy-functions-deploy-help.txt
          grep -q -- '--no-verify-jwt' /tmp/sandy-functions-deploy-help.txt
          mkdir -p supabase/functions/sandy-agent-runtime-v2
          cp artifacts/sandy-v2-core/v2-runtime.ts supabase/functions/sandy-agent-runtime-v2/index.ts
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/sandy-v2-core')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'baseline-candidate-comparison.json').read_text())
          assert r['isolated_candidate_regression_check_passed'] is True
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime-v2/index.ts').read_bytes()).hexdigest()==m['candidate_sha256']
          assert hashlib.sha256(Path('supabase/functions/sandy-agent-runtime/index.ts').read_bytes()).hexdigest()==m['baseline_sha256']
          PY
          supabase functions deploy sandy-agent-runtime-v2 --project-ref zmqlyygzqoidkcwdysok --no-verify-jwt
      - name: Verify unauthenticated requests are rejected
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --max-time 30 -o /tmp/sandy-v2-auth.json -w '%{http_code}' -X POST 'https://zmqlyygzqoidkcwdysok.supabase.co/functions/v1/sandy-agent-runtime-v2' -H 'Content-Type: application/json' --data '{}')"
          test "$CODE" = '403' || { echo "::error::Expected auth rejection; got HTTP $CODE"; exit 1; }
          jq -e '.error == "unauthorized"' /tmp/sandy-v2-auth.json
          echo 'Isolated candidate deployed. Authenticated workflow acceptance, actual rollback and customer cutover still required.'
