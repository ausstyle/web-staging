name: Deploy Sandy Engineering MCP
on:
  push:
    branches: [main]
    paths:
      - 'services/sandy-engineering-mcp/**'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'scripts/sandy/sync_mcp_transport.py'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
  pull_request:
    paths:
      - 'services/sandy-engineering-mcp/**'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'scripts/sandy/sync_mcp_transport.py'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - '.github/workflows/sandy-engineering-mcp-deploy.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run source and transport checks without changing Google Cloud
        required: true
        default: true
        type: boolean
      reuse_run_id:
        description: Existing release run to accept without building or deploying another candidate
        required: false
        default: ''
        type: string
      reuse_run_attempt:
        description: Attempt that deployed the existing candidate
        required: false
        default: ''
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sandy-engineering-mcp-check-{0}', github.event.pull_request.number) || 'sandy-engineering-mcp-deploy' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MCP source
        working-directory: services/sandy-engineering-mcp
        run: |
          set -euo pipefail
          node --check src/server.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          python3 ../../scripts/sandy/sync_mcp_transport.py --check
          npm test
      - name: Validate existing-candidate reconciliation guards
        run: python3 -m unittest discover -s scripts/sandy -p 'test_mcp_candidate_reconciliation.py' -v
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    needs: verify
    runs-on: ubuntu-latest
    environment: sandy-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate candidate reuse inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.reuse_run_attempt }}
        run: |
          python3 - <<'PY'
          import os
          if bool(os.environ['SOURCE_RUN_ID']) != bool(os.environ['SOURCE_RUN_ATTEMPT']):
              raise SystemExit('Both existing release run and attempt are required together')
          PY
      - name: Select the preserved release artifact
        id: existing
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.reuse_run_attempt }}
        run: >-
          python3 scripts/sandy/reconcile_mcp_candidate.py select
          --output-dir "$RUNNER_TEMP/sandy-mcp-source"
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run_id != '' }}
        with:
          artifact-ids: ${{ steps.existing.outputs.artifact_id }}
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sandy-mcp-release
          merge-multiple: true
      - name: Validate release configuration
        env:
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          GCP_PROJECT: ${{ vars.SANDY_GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.SANDY_GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.SANDY_GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_ENABLED" = "true" || { echo "::error::Production deployment disabled"; exit 1; }
          test "$GCP_PROJECT" = "elaborate-haven-511518-a5" || { echo "::error::Unexpected Google Cloud project"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Missing WIF provider"; exit 1; }
          test -n "$DEPLOYER_SA" || { echo "::error::Missing scoped deploy service account"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.SANDY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SANDY_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reconcile existing candidate against Google Cloud without mutation
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.reuse_run_attempt }}
        run: >-
          python3 scripts/sandy/reconcile_mcp_candidate.py verify
          --output-dir "$RUNNER_TEMP/sandy-mcp-source"
          --release-dir "$RUNNER_TEMP/sandy-mcp-release"
      - name: Preserve current revision and deploy a candidate without changing traffic
        if: ${{ inputs.reuse_run_id == '' }}
        env:
          PROJECT: ${{ vars.SANDY_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandy-mcp-release"
          gcloud run services describe sandy-engineering-mcp \
            --project "$PROJECT" --region europe-west1 --format=json > "$RUNNER_TEMP/sandy-mcp-before-private.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = root / 'sandy-mcp-before-private.json'
          service = json.loads(raw.read_text())
          status = service.get('status', {})
          actual_identity = service.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
          expected_identity = 'sandy-mcp-runtime@' + os.environ['PROJECT'] + '.iam.gserviceaccount.com'
          # Inspect before deployment. Do not silently reassign an unexpected
          # identity or expand actAs/IAM privileges to get a successful release.
          if actual_identity != expected_identity:
              print('::error::Cloud Run identity mismatch: expected ' + expected_identity + '; observed ' + str(actual_identity))
              raise RuntimeError('deployed_Cloud_Run_runtime_identity_mismatch')
          traffic = [{key: row[key] for key in ('revisionName', 'percent', 'tag') if key in row}
                     for row in status.get('traffic', [])]
          revisions = []
          for row in traffic:
              if row.get('percent', 0) > 0:
                  revision = row.get('revisionName')
                  if not revision:
                      raise RuntimeError('resolved_previous_revision_required')
                  revisions.append(revision + '=' + str(row['percent']))
          if not revisions or sum(row.get('percent', 0) for row in traffic) != 100:
              raise RuntimeError('exact_previous_traffic_required')
          out = root / 'sandy-mcp-release'
          (out / 'before.json').write_text(json.dumps({'service': 'sandy-engineering-mcp',
              'project': os.environ['PROJECT'], 'region': 'europe-west1', 'traffic': traffic, 'url': status.get('url'),
              'latestReadyRevisionName': status.get('latestReadyRevisionName'),
              'verified_runtime_identity': actual_identity,
              'source_commit_candidate': os.environ['GITHUB_SHA'], 'environment_values_recorded': False}, indent=2))
          (out / 'rollback-command.txt').write_text('gcloud run services update-traffic sandy-engineering-mcp '
              '--project elaborate-haven-511518-a5 --region europe-west1 --to-revisions=' + ','.join(revisions) + ' --quiet\n')
          raw.unlink()
          PY
          gcloud run deploy sandy-engineering-mcp \
            --project "$PROJECT" \
            --region europe-west1 \
            --source services/sandy-engineering-mcp \
            --service-account "sandy-mcp-runtime@$PROJECT.iam.gserviceaccount.com" \
            --revision-suffix "api-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --no-traffic --tag sandy-api-review \
            --quiet
          gcloud run services describe sandy-engineering-mcp \
            --project "$PROJECT" --region europe-west1 \
            --format='json(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' \
            > "$RUNNER_TEMP/sandy-mcp-release/after.json"
          candidate=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"]["latestCreatedRevisionName"])' "$RUNNER_TEMP/sandy-mcp-release/after.json")
          gcloud run revisions describe "$candidate" --project "$PROJECT" --region europe-west1 \
            --format='json(metadata.name,spec.serviceAccountName,status.conditions)' \
            > "$RUNNER_TEMP/sandy-mcp-release/candidate-runtime-identity.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sandy-mcp-release'
          before = json.loads((root / 'before.json').read_text())
          after = json.loads((root / 'after.json').read_text())['status']
          identity = json.loads((root / 'candidate-runtime-identity.json').read_text())
          if identity.get('spec', {}).get('serviceAccountName') != before['verified_runtime_identity']:
              raise RuntimeError('candidate_runtime_identity_mismatch')
          def active(rows):
              return sorted((row['revisionName'], row['percent']) for row in rows if row.get('percent', 0) > 0)
          if active(before['traffic']) != active(after.get('traffic', [])):
              raise RuntimeError('production_traffic_changed_requires_recorded_rollback')
          PY
          echo "Candidate deployed without changing production traffic or invoker IAM. Authenticated MCP/provider acceptance is required before promotion."
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Verify candidate through normal Auth, MCP and the real provider
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CANDIDATE_SOURCE_COMMIT: ${{ steps.existing.outputs.source_commit || github.sha }}
        run: >-
          deno run --allow-env --allow-net --allow-read --allow-write
          scripts/sandy/verify_mcp_candidate.ts
          --release-dir "$RUNNER_TEMP/sandy-mcp-release"
          --source-commit "$CANDIDATE_SOURCE_COMMIT"
          --output "$RUNNER_TEMP/sandy-mcp-release/authenticated-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-mcp-release-${{ github.sha }}
          path: ${{ runner.temp }}/sandy-mcp-release/
