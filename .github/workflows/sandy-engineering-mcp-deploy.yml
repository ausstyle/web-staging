name: Deploy Sandy Engineering MCP
on:
  push:
    branches: [main]
    paths:
      - 'services/sandy-engineering-mcp/**'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'scripts/sandy/sync_mcp_transport.py'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
  pull_request:
    paths:
      - 'services/sandy-engineering-mcp/**'
      - 'supabase/functions/_shared/sandy_mcp_transport.mjs'
      - 'scripts/sandy/sync_mcp_transport.py'
      - 'scripts/sandy/verify_mcp_candidate*'
      - 'supabase/functions/_shared/sandy_engineering_session*'
      - 'supabase/functions/sandy-engineering-runtime/**'
      - '.github/workflows/sandy-engineering-mcp-deploy.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run source and transport checks without changing Google Cloud
        required: true
        default: true
        type: boolean
      iap_repair_transport:
        description: Deploy the reviewed IAP transport to its separate non-production tag after installed-prerequisite verification
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sandy-engineering-mcp-check-{0}', github.event.pull_request.number) || 'sandy-engineering-mcp-deploy' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MCP source
        working-directory: services/sandy-engineering-mcp
        run: |
          set -euo pipefail
          node --check src/server.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          python3 ../../scripts/sandy/sync_mcp_transport.py --check
          npm test
  deploy:
    # Main pushes validate source only. A release owner dispatches the bounded
    # deployment after prerequisite reconciliation; no accidental candidate or
    # movement of the preserved sandy-api-review tag on a source merge.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    needs: verify
    runs-on: ubuntu-latest
    environment: sandy-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release configuration
        env:
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          GCP_PROJECT: ${{ vars.SANDY_GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.SANDY_GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.SANDY_GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_ENABLED" = "true" || { echo "::error::Production deployment disabled"; exit 1; }
          test "$GCP_PROJECT" = "elaborate-haven-511518-a5" || { echo "::error::Unexpected Google Cloud project"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Missing WIF provider"; exit 1; }
          test -n "$DEPLOYER_SA" || { echo "::error::Missing scoped deploy service account"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.SANDY_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SANDY_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify installed protected IAP dependencies before creating a candidate
        if: ${{ inputs.iap_repair_transport }}
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
        run: >-
          python3 scripts/sandy/verify_iap_transport_installation.py
          --output "$RUNNER_TEMP/iap-transport-installed-prerequisites.json"
      # Previous protected IAP runtime bindings persist across release attempts.
      # Abort BEFORE moving the shared candidate tag; never overwrite old
      # bindings or create an orphaned new tagged candidate on a blind retry.
      - name: Detect existing IAP bindings before changing Cloud Run
        if: ${{ inputs.iap_repair_transport }}
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/sandy python3 -m unittest scripts/sandy/test_check_existing_iap_binding.py -v
          python3 scripts/sandy/check_existing_iap_binding.py
      - name: Preserve current revision and deploy a candidate without changing traffic
        env:
          PROJECT: ${{ vars.SANDY_GCP_PROJECT_ID }}
          IAP_REPAIR_TRANSPORT: ${{ inputs.iap_repair_transport }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandy-mcp-release"
          gcloud run services describe sandy-engineering-mcp \
            --project "$PROJECT" --region europe-west1 --format=json > "$RUNNER_TEMP/sandy-mcp-before-private.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = root / 'sandy-mcp-before-private.json'
          service = json.loads(raw.read_text())
          status = service.get('status', {})
          actual_identity = service.get('spec', {}).get('template', {}).get('spec', {}).get('serviceAccountName')
          expected_identity = 'sandy-mcp-runtime@' + os.environ['PROJECT'] + '.iam.gserviceaccount.com'
          # Inspect before deployment. Do not silently reassign an unexpected
          # identity or expand actAs/IAM privileges to get a successful release.
          if actual_identity != expected_identity:
              print('::error::Cloud Run identity mismatch: expected ' + expected_identity + '; observed ' + str(actual_identity))
              raise RuntimeError('deployed_Cloud_Run_runtime_identity_mismatch')
          traffic = [{key: row[key] for key in ('revisionName', 'percent', 'tag', 'url') if key in row}
                     for row in status.get('traffic', [])]
          revisions = []
          for row in traffic:
              if row.get('percent', 0) > 0:
                  revision = row.get('revisionName')
                  if not revision:
                      raise RuntimeError('resolved_previous_revision_required')
                  revisions.append(revision + '=' + str(row['percent']))
          if not revisions or sum(row.get('percent', 0) for row in traffic) != 100:
              raise RuntimeError('exact_previous_traffic_required')
          out = root / 'sandy-mcp-release'
          (out / 'before.json').write_text(json.dumps({'service': 'sandy-engineering-mcp',
              'project': os.environ['PROJECT'], 'region': 'europe-west1', 'traffic': traffic, 'url': status.get('url'),
              'latestReadyRevisionName': status.get('latestReadyRevisionName'),
              'verified_runtime_identity': actual_identity,
              'source_commit_candidate': os.environ['GITHUB_SHA'], 'environment_values_recorded': False}, indent=2))
          (out / 'rollback-command.txt').write_text('gcloud run services update-traffic sandy-engineering-mcp '
              '--project elaborate-haven-511518-a5 --region europe-west1 --to-revisions=' + ','.join(revisions) + ' --quiet\n')
          raw.unlink()
          PY
          candidate_tag=sandy-api-review
          revision_suffix="api-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          transport_env="SANDY_IAP_REPAIR_ENABLED=false"
          if [ "$IAP_REPAIR_TRANSPORT" = "true" ]; then
            candidate_tag=sandy-iap-repair-review
            revision_suffix="iap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            source_sha256=$(PYTHONPATH=scripts/sandy python3 -c 'from prepare_iap_repair_transport import worker_manifest; print(worker_manifest()["source_sha256"])')
            transport_env="SANDY_IAP_REPAIR_ENABLED=true,SANDY_IAP_REPAIR_SOURCE_SHA256=$source_sha256"
          fi
          gcloud run deploy sandy-engineering-mcp \
            --project "$PROJECT" \
            --region europe-west1 \
            --source services/sandy-engineering-mcp \
            --service-account "sandy-mcp-runtime@$PROJECT.iam.gserviceaccount.com" \
            --revision-suffix "$revision_suffix" \
            --no-traffic --tag "$candidate_tag" \
            --labels "sandy-source-commit=$GITHUB_SHA" \
            --update-env-vars "$transport_env" \
            --quiet
          gcloud run services describe sandy-engineering-mcp \
            --project "$PROJECT" --region europe-west1 \
            --format='json(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' \
            > "$RUNNER_TEMP/sandy-mcp-release/after.json"
          candidate=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"]["latestCreatedRevisionName"])' "$RUNNER_TEMP/sandy-mcp-release/after.json")
          gcloud run revisions describe "$candidate" --project "$PROJECT" --region europe-west1 \
            --format=json > "$RUNNER_TEMP/sandy-revision-private.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); raw=root/'sandy-revision-private.json'
          revision=json.loads(raw.read_text()); spec=revision.get('spec',{}); status=revision.get('status',{})
          safe={'metadata':revision.get('metadata',{}),'spec':{'serviceAccountName':spec.get('serviceAccountName')},'status':{'conditions':status.get('conditions',[]),'imageDigest':status.get('imageDigest')}}
          # Provider metadata labels contain no environment credentials. Select
          # only the two public transport configuration values below.
          safe['metadata']={k:safe['metadata'].get(k) for k in ['name','labels']}
          out=root/'sandy-mcp-release';(out/'candidate-runtime-identity.json').write_text(json.dumps(safe,indent=2))
          if os.environ.get('IAP_REPAIR_TRANSPORT')=='true':
              env={x.get('name'):x.get('value') for x in spec.get('containers',[{}])[0].get('env',[]) if x.get('name') in ['SANDY_IAP_REPAIR_ENABLED','SANDY_IAP_REPAIR_SOURCE_SHA256']}
              (out/'iap-runtime-identity.json').write_text(json.dumps({'revision':safe['metadata']['name'],'runtime_identity':spec.get('serviceAccountName'),
                'source_commit':safe['metadata'].get('labels',{}).get('sandy-source-commit'),'source_sha256':env.get('SANDY_IAP_REPAIR_SOURCE_SHA256'),
                'transport_enabled':env.get('SANDY_IAP_REPAIR_ENABLED'),'ready':any(c.get('type')=='Ready' and c.get('status')=='True' for c in status.get('conditions',[])),
                'image_digest':status.get('imageDigest')},indent=2))
          raw.unlink()
          PY
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sandy-mcp-release'
          before = json.loads((root / 'before.json').read_text())
          after = json.loads((root / 'after.json').read_text())['status']
          identity = json.loads((root / 'candidate-runtime-identity.json').read_text())
          if identity.get('spec', {}).get('serviceAccountName') != before['verified_runtime_identity']:
              raise RuntimeError('candidate_runtime_identity_mismatch')
          def active(rows):
              return sorted((row['revisionName'], row['percent']) for row in rows if row.get('percent', 0) > 0)
          if active(before['traffic']) != active(after.get('traffic', [])):
              raise RuntimeError('production_traffic_changed_requires_recorded_rollback')
          PY
          echo "Candidate deployed without changing production traffic or invoker IAM. Authenticated MCP/provider acceptance is required before promotion."
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Verify candidate through normal Auth, MCP and the real provider
        if: ${{ !inputs.iap_repair_transport }}
        env:
          SANDY_ACCEPTANCE_PRIMARY_BINDING: SANDY_SUPABASE_MANAGEMENT_TOKEN
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          SANDY_ACCEPTANCE_EXISTING_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
          SANDY_ACCEPTANCE_EXISTING_ACCESS_TOKEN: ${{ secrets.SANDY_SUPABASE_ACCESS_TOKEN }}
        run: >-
          deno run --allow-env --allow-net --allow-read --allow-write
          scripts/sandy/verify_mcp_candidate.ts
          --release-dir "$RUNNER_TEMP/sandy-mcp-release"
          --output "$RUNNER_TEMP/sandy-mcp-release/authenticated-acceptance.json"
      - name: Bind the independently verified IAP revision through protected Management
        if: ${{ inputs.iap_repair_transport }}
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
        run: >-
          python3 scripts/sandy/bind_iap_transport_runtime.py
          --release-dir "$RUNNER_TEMP/sandy-mcp-release"
      - name: Verify normal workload and MCP denial before administrator issuance
        if: ${{ inputs.iap_repair_transport }}
        env:
          SANDY_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SANDY_SUPABASE_MANAGEMENT_TOKEN }}
        run: >-
          deno run --allow-env --allow-net --allow-read --allow-write
          scripts/sandy/verify_iap_closed_candidate.ts
          "$RUNNER_TEMP/sandy-mcp-release"
          "$RUNNER_TEMP/sandy-mcp-release/iap-closed-acceptance.json"
      - name: Independently recheck live traffic and both candidate tags after closed acceptance
        if: ${{ inputs.iap_repair_transport }}
        env:
          PROJECT: ${{ vars.SANDY_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud run services describe sandy-engineering-mcp --project "$PROJECT" --region europe-west1 \
            --format='json(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)' \
            > "$RUNNER_TEMP/sandy-mcp-release/iap-live-service-after-acceptance.json"
          PYTHONPATH=scripts/sandy python3 - <<'PY'
          import json, os, pathlib
          from bind_iap_transport_runtime import validate
          from prepare_iap_repair_transport import worker_manifest
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sandy-mcp-release'
          read=lambda name:json.loads((root/name).read_text())
          proof=validate(read('before.json'),read('iap-live-service-after-acceptance.json'),read('iap-runtime-identity.json'),os.environ['GITHUB_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'],worker_manifest())
          (root/'iap-final-provider-readback.json').write_text(json.dumps(proof,indent=2))
          print('::notice title=IAP candidate final provider readback::'+json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandy-mcp-release-${{ github.sha }}
          path: ${{ runner.temp }}/sandy-mcp-release/
