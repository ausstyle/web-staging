<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Files — Sandy</title><style>
:root{font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;padding:32px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.muted{color:#777}.back{font-size:13px;color:#666}.heading{margin:48px 0 24px}h1{font-size:40px;letter-spacing:-1.8px;font-weight:620;margin:0 0 5px}.search{width:100%;border:1px solid #e3e3e3;border-radius:12px;padding:14px 16px;outline:0}.search:focus{border-color:#555}.toolbar{display:flex;gap:15px;align-items:center;margin:16px 0 20px;justify-content:space-between}.sub{font-size:12px;color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.grid.list{display:flex;flex-direction:column;gap:0}.grid.list .file{min-height:0;padding:10px 12px;flex-direction:row;align-items:center;border:0;border-bottom:1px solid #eee;border-radius:0;gap:16px}.grid.list .thumb{width:58px;height:47px;min-height:47px;flex:0 0 58px}.grid.list .desc{-webkit-line-clamp:1}.grid.list .pills{margin-left:auto;margin-top:0}.grid.list .file strong{min-width:190px;max-width:35%}.grid.list .file .desc{flex:1}.file{border:1px solid #e9e9e9;border-radius:13px;text-align:left;background:#fff;padding:10px;min-height:0;display:flex;flex-direction:column;gap:7px}.thumb{width:100%;height:136px;border-radius:8px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.file{position:relative}.download-arrow{position:absolute;bottom:12px;right:12px;width:28px;height:28px;border:1px solid #dedede;border-radius:50%;background:#fff;color:#222;font-size:17px;font-weight:500;display:grid;place-items:center;box-shadow:0 2px 7px #00000012;z-index:2;transition:background .15s,color .15s,transform .15s}.download-arrow:hover{background:#171717;color:#fff;transform:translateY(-1px)}.download-arrow:focus-visible{outline:2px solid #111;outline-offset:2px}.grid.list .download-arrow{position:static;flex:0 0 28px;order:5;margin-left:8px}.file .pills{padding-right:34px}.grid.list .file .pills{padding-right:0}.view.secondary{background:#fff;color:#171717;border:1px solid #ddd;margin-left:8px}.file strong{line-height:1.3}.toggle{background:#fff;border:1px solid #ddd;border-radius:7px;padding:5px 9px;color:#555}.toggle.active{background:#171717;color:#fff;border-color:#171717}.tools{display:flex;gap:5px;align-items:center}.file:hover{border-color:#bbb;background:#fafafa}.file strong{font-size:14px;font-weight:650;overflow-wrap:anywhere}.desc{color:#666;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pills{margin-top:auto;display:flex;gap:5px;flex-wrap:wrap}.pill{border-radius:5px;background:#f2f2f2;font-size:11px;padding:3px 7px;color:#565656}.placeholder{padding:50px 5px;color:#777}.icon{font-size:21px}.error{color:#a22}.detail{position:fixed;z-index:1000;inset:0;background:#0007;display:none;justify-content:flex-end}.detail.open{display:flex}.panel{background:#fff;width:min(560px,100vw);height:100%;overflow:auto;padding:30px;box-shadow:-10px 0 50px #0001}.panel h2{overflow-wrap:anywhere;font-weight:600;font-size:24px}.close{background:none;border:0;font-size:24px}.view{background:#161616;color:white;border:0;border-radius:9px;padding:11px 18px;margin-top:20px}.preview{width:100%;max-height:350px;object-fit:contain;background:#f6f6f6;border-radius:10px;margin-top:20px}.foot{margin-top:30px;font-size:12px;color:#888}@media(max-width:700px){.shell{padding:20px}.heading{margin-top:30px}h1{font-size:32px}}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;width:100%;min-height:32px}.card-footer .pills{margin:0;padding-right:0;flex:1;min-width:0}.card-footer .download-arrow{position:static;top:auto;bottom:auto;right:auto;left:auto;flex:0 0 28px;width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;box-shadow:0 1px 5px #00000016}.grid.list .card-footer{width:auto;margin-left:auto;margin-top:0;gap:8px}.grid.list .card-footer .pills{margin:0}.grid.list .card-footer .download-arrow{margin:0}
.lifecycle-tabs{display:flex;gap:5px}.lifecycle-tabs button{border:1px solid #ddd;border-radius:8px;background:white;padding:5px 9px;font-size:12px}.lifecycle-tabs button.active{background:#171717;color:#fff}.manage{border:1px solid #dedede;border-radius:50%;background:#fff;width:28px;height:28px;display:grid;place-items:center;font-size:16px}.card-footer{gap:5px}.file .card-footer .manage{flex:0 0 28px}.manage:hover{background:#eee}.file-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.file-actions button{border:1px solid #ddd;border-radius:9px;background:white;padding:9px 13px}.file-actions button.danger{color:#a32828}
.history{margin-top:28px;border-top:1px solid #e7e7e7;padding-top:21px}.history h3{font-size:17px;margin:0 0 5px;letter-spacing:-.3px}.history-note{font-size:12px;color:#777;margin:3px 0 16px}.history-item{border-left:2px solid #e2e2e2;padding:0 0 17px 14px;margin-left:5px}.history-item strong{font-size:13px;display:block}.history-item p{font-size:12px;color:#666;margin:3px 0 4px;overflow-wrap:anywhere}.history-item time{color:#888;font-size:11px}.history-count{font-size:12px;color:#777;margin-bottom:12px}</style></head><body><div class="shell"><header class="top"><a class="brand" href="../app/">Sandy<span class="muted">.</span></a><a class="back" href="../app/">← Back to workspace</a></header><section class="heading"><div class="muted">YOUR LIBRARY</div><h1>Files</h1><div class="muted">Everything you've shared with Sandy, available in one place.</div></section><input id="query" class="search" placeholder="Search files, subjects or descriptions…" aria-label="Search your files"><div class="toolbar"><span id="count" class="sub">Loading your library…</span><div class="lifecycle-tabs"><button data-state="active" class="active">Files</button><button data-state="archived">Archived</button><button data-state="trashed">Recently deleted</button></div><div class="tools"><select id="fileSort" aria-label="Sort files"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="largest">Largest first</option><option value="smallest">Smallest first</option><option value="name">Name A–Z</option></select><button id="gallery" class="toggle active" type="button">Gallery</button><button id="list" class="toggle" type="button">List</button><button id="refresh" style="background:none;border:0;color:#666">↻ Refresh</button></div></div><main id="grid" class="grid"></main><div id="status" class="placeholder" role="status"></div><p class="foot">Files stay private to your Sandy account. AI-generated descriptions may be incomplete; originals remain unchanged.</p></div><div id="detail" class="detail" role="dialog" aria-label="File details"><div class="panel"><button id="close" class="close" aria-label="Close">×</button><div id="detailContent"></div></div></div><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.0";
import{installSandyIdleLock}from"../security-lock.js";
const sb=createClient("https://zmqlyygzqoidkcwdysok.supabase.co","sb_publishable_OVP7LUMDhtcymPRzZuCK3Q_8JkLC3ts",{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,detectSessionInUrl:true}});
installSandyIdleLock(sb.auth);
const $=id=>document.getElementById(id), endpoint="https://zmqlyygzqoidkcwdysok.supabase.co/functions/v1/sandy-files";
let files=[],selected=null,mode="gallery",libraryState="active";
async function api(action,body={}){let {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error("Please sign in to your Sandy workspace first.");let r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},body:JSON.stringify({action,...body})});if(r.status===401){const refresh=await sb.auth.refreshSession();if(refresh.data?.session?.access_token)r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+refresh.data.session.access_token},body:JSON.stringify({action,...body})})}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"File request failed");return j}
const elem=(tag,text,cl)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cl)e.className=cl;return e};
function descriptionFor(f){return (f.description||"").trim()||(f.ai_description||"").trim()||"AI description pending"}
function render(){const q=$("query").value.toLowerCase().trim();const matches=files.filter(f=>(f.library_state||"active")===libraryState).filter(f=>!q||[f.display_name,f.ai_description,f.description,JSON.stringify(f.classification)].join(" ").toLowerCase().includes(q));const order=$("fileSort").value;matches.sort((a,b)=>order==="oldest"?new Date(a.created_at)-new Date(b.created_at):order==="largest"?(b.byte_size||0)-(a.byte_size||0):order==="smallest"?(a.byte_size||0)-(b.byte_size||0):order==="name"?String(a.display_name||"").localeCompare(String(b.display_name||"")):new Date(b.created_at)-new Date(a.created_at));$("grid").replaceChildren();$("grid").classList.toggle("list",mode==="list");$("gallery").classList.toggle("active",mode==="gallery");$("list").classList.toggle("active",mode==="list");$("count").textContent=matches.length+" of "+files.length+" files";$("status").textContent=matches.length?"":files.length?"No matching files.":"No files have been indexed yet.";for(const f of matches){const b=elem("button",undefined,"file");b.type="button";const thumb=elem("div",undefined,"thumb");if(f.thumbnail_url){const img=elem("img");img.src=f.thumbnail_url;img.loading="lazy";img.alt="Thumbnail of "+f.display_name;img.referrerPolicy="no-referrer";img.onerror=()=>thumb.replaceChildren(elem("span","▧","icon"));thumb.append(img)}else thumb.append(elem("span",String(f.mime_type||"").startsWith("image/")?"▧":"▤","icon"));b.append(thumb,elem("strong",f.display_name||"Unnamed file"),elem("div",descriptionFor(f),"desc"));const pills=elem("div",undefined,"pills");if(f.analysis_status!=="ready")pills.append(elem("span",f.analysis_status==="needs_review"?"AI review needed":"AI processing","pill"));if(f.dedup_status!=="checked")pills.append(elem("span",f.dedup_status==="failed"?"Dedup review needed":"Dedup pending","pill"));for(const category of (f.classification?.categories||[]).slice(0,2))pills.append(elem("span",category,"pill"));pills.append(elem("span",new Date(f.created_at).toLocaleDateString(),"pill"));const footer=elem("div",undefined,"card-footer");footer.append(pills);b.append(footer);b.addEventListener("click",()=>open(f));const arrow=elem("span","↓","download-arrow");arrow.title="Download original";arrow.setAttribute("role","button");arrow.tabIndex=0;arrow.setAttribute("aria-label","Download "+f.display_name);arrow.onclick=e=>{e.stopPropagation();download(f)};arrow.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();download(f)}};footer.append(arrow);const more=elem("span","···","manage");more.title="Manage file";more.setAttribute("role","button");more.setAttribute("aria-label","Manage "+f.display_name);more.tabIndex=0;more.onclick=e=>{e.stopPropagation();open(f)};more.onkeydown=e=>{if(e.key==="Enter"){e.stopPropagation();open(f)}};footer.append(more);$("grid").append(b)}}
async function download(f){try{const result=await api("open",{id:f.id});const response=await fetch(result.url);if(!response.ok)throw Error("Could not retrieve original");const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=f.display_name||"Sandy file";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){alert("Download failed: "+e.message)}}
async function setFileState(f,state){const label=state==="trashed"?"Move this file to Recently deleted? Its original and historical references will be preserved.":state==="archived"?"Archive this file?":"Restore this file to Files?";if(!confirm(label))return;try{await api("set_state",{id:f.id,state});$("detail").classList.remove("open");await load()}catch(e){alert(e.message)}}
async function open(f){selected=f;$("detail").classList.add("open");const box=$("detailContent");box.replaceChildren(elem("div","FILE DETAILS","muted"),elem("h2",f.display_name),elem("p",descriptionFor(f)));const pills=elem("div",undefined,"pills");for(const s of [...(f.classification?.categories||[]),...(f.classification?.subjects||[])])pills.append(elem("span",s,"pill"));box.append(pills);const caption=elem("label","Your description (takes priority)");const field=elem("textarea");field.value=f.description||"";field.placeholder="Describe this file";field.maxLength=4000;field.rows=3;field.style.cssText="display:block;width:100%;margin:7px 0 10px;border:1px solid #ddd;border-radius:9px;padding:9px;font:inherit";caption.append(field);box.append(caption);const saveCaption=elem("button","Save description","view");saveCaption.onclick=async()=>{saveCaption.disabled=true;try{const result=await api("set_description",{id:f.id,description:field.value});f.description=result.description;render();open(f)}catch(e){alert(e.message);saveCaption.disabled=false}};box.append(saveCaption);box.append(elem("p","Processing: AI "+(f.analysis_status||"pending")+" · Dedup "+(f.dedup_status||"pending"),"muted"));box.append(elem("p",f.ai_description?"AI suggestion: "+f.ai_description:"AI description pending","muted"));box.append(elem("p",new Date(f.created_at).toLocaleString()+" · "+Number(f.byte_size||0).toLocaleString()+" bytes","muted"));if(f.thumbnail_url){const im=elem("img",undefined,"preview");im.src=f.thumbnail_url;im.alt=f.display_name;box.append(im)}const button=elem("button","Open original ↗","view");box.append(button);const save=elem("button","↓ Download","view secondary");save.onclick=()=>download(f);box.append(save);const actions=elem("div",undefined,"file-actions");if((f.library_state||"active")!=="active"){const restore=elem("button","Restore to Files");restore.onclick=()=>setFileState(f,"active");actions.append(restore)}if((f.library_state||"active")==="active"){const archive=elem("button","Archive");archive.onclick=()=>setFileState(f,"archived");actions.append(archive)}if((f.library_state||"active")!=="trashed"){const remove=elem("button","Move to Recently deleted","danger");remove.onclick=()=>setFileState(f,"trashed");actions.append(remove)}box.append(actions);loadFileHistory(f,box);button.onclick=async()=>{button.disabled=true;try{const r=await api("open",{id:f.id});window.open(r.url,"_blank","noopener,noreferrer")}catch(e){alert(e.message)}finally{button.disabled=false}}}
async function loadFileHistory(f,root){
 const section=elem("section",undefined,"history");section.append(elem("h3","File history & usage"));const status=elem("p","Loading references…","history-note");section.append(status);root.append(section);
 try{
  const data=await api("history",{id:f.id});
  if(!section.isConnected)return;
  const items=data.history||[];
  status.textContent=items.length+" recorded reference"+(items.length===1?"":"s")+" · "+(data.merged_copies||0)+" merged duplicate"+((data.merged_copies||0)===1?"":"s");
  for(const item of items){const node=elem("div",undefined,"history-item");const type=item.kind==="usage"?"Used by "+item.channel:"From "+item.channel;node.append(elem("strong",type));node.append(elem("p",item.label||item.relationship||item.source_table||"File reference"));if(item.detail?.message_excerpt)node.append(elem("p",item.detail.message_excerpt));if(item.source_record_id)node.append(elem("p","Reference: "+item.source_record_id));const t=elem("time",item.occurred_at?new Date(item.occurred_at).toLocaleString():"Date unavailable");node.append(t);section.append(node)}
  if(!items.length)section.append(elem("p","No source or usage entries recorded yet.","history-note"));
  section.append(elem("p",data.coverage_note||"","history-note"));
 }catch(e){status.textContent="History unavailable: "+e.message}
}
document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{libraryState=b.dataset.state;document.querySelectorAll("[data-state]").forEach(x=>x.classList.toggle("active",x===b));render()});
async function load(){$("status").textContent="";try{const x=await api("list");files=x.files||[];render()}catch(e){$("count").textContent="Library unavailable";$("status").textContent=e.message;$("status").classList.add("error")}}
$("gallery").onclick=()=>{mode="gallery";render()};$("list").onclick=()=>{mode="list";render()};$("query").addEventListener("input",render);$("fileSort").addEventListener("change",render);$("refresh").onclick=load;$("close").onclick=()=>$("detail").classList.remove("open");$("detail").addEventListener("click",e=>{if(e.target===$("detail"))$("detail").classList.remove("open")});document.addEventListener("keydown",e=>{if(e.key==="Escape")$("detail").classList.remove("open")});load();
</script></body></html>
