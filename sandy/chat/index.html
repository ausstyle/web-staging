<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandy Chat</title><style>
*{box-sizing:border-box}body{margin:0;color:#111;background:#fff;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:270px 1fr;height:100dvh}.side{background:#f8f8f8;border-right:1px solid #e7e7e7;display:flex;flex-direction:column;min-height:0}.sidehead{padding:20px}.brand{font-size:26px;font-weight:800;letter-spacing:-1.5px}.sidehead button,.sidehead input{display:block;width:100%;border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px;margin-top:14px;text-align:left}.list{overflow-y:auto;flex:1;padding:10px}.list button{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:9px;padding:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list button:hover,.list button.selected{background:#e9e9e9}.sidefoot{padding:16px;font-size:12px;border-top:1px solid #ddd;display:flex;justify-content:space-between}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.top{border-bottom:1px solid #eee;min-height:65px;padding:17px 22px;font-weight:700}.top button{display:none}.feed{flex:1;overflow-y:auto;width:min(800px,100%);margin:auto;padding:30px 26px}.welcome{text-align:center;margin-top:19vh;font-size:28px;font-weight:650}.turn{white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0;line-height:1.7}.turn.user{margin-left:14%;padding:15px;background:#f2f2f2;border-radius:15px}.composer{width:min(800px,100%);margin:auto;padding:12px 20px 20px}.entry{display:flex;gap:8px;align-items:end;border:1px solid #ddd;border-radius:17px;padding:10px}.entry textarea{flex:1;min-width:0;border:0;outline:0;resize:vertical;min-height:48px;max-height:160px;padding:8px;font-size:16px}.entry button{background:#111;color:white;border:0;border-radius:11px;padding:10px 14px}.status{text-align:center;font-size:11px;color:#777;margin-top:8px}
@media(max-width:700px){.shell{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:9;top:0;left:0;bottom:0;width:min(310px,86vw);box-shadow:8px 0 35px #0002}.shell.open .side{display:flex}.top button{display:inline-block;margin-right:12px;border:1px solid #ddd;border-radius:8px;background:#fff;padding:7px 10px}.feed{padding:17px}.composer{padding:10px 12px calc(14px + env(safe-area-inset-bottom))}}
</style></head><body><div class="shell" id="shell"><aside class="side"><div class="sidehead"><div class="brand">sandy.</div><button id="new">＋ New chat</button><input id="filter" placeholder="Search web conversations"></div><div class="list" id="topics"></div><div class="sidehead" style="padding-bottom:0;font-size:11px;color:#777;font-weight:700;text-transform:uppercase">Web conversations</div><div class="list" id="list"></div><div class="sidefoot"><a href="../app/">Workspace</a><a href="../app/?view=history">All conversations</a></div></aside><div class="main"><header class="top"><button id="menu">☰</button>Chat with Sandy</header><div class="feed" id="feed"><div class="welcome">What can Sandy help with?</div></div><div class="composer"><form class="entry" id="form"><textarea id="question" rows="2" placeholder="Message Sandy…" required maxlength="12000"></textarea><button id="send">Send ↑</button></form><div class="status" id="status">Web conversations are saved in All Conversations.</div></div></div></div><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.105.0";
const sb=createClient("https://zmqlyygzqoidkcwdysok.supabase.co","sb_publishable_OVP7LUMDhtcymPRzZuCK3Q_8JkLC3ts",{auth:{persistSession:true,storage:localStorage,autoRefreshToken:true,detectSessionInUrl:true}}),url="https://zmqlyygzqoidkcwdysok.supabase.co/functions/v1/sandy-workspace",$=id=>document.getElementById(id);let current=null,records=[],topics=[],busy=false;
async function api(action,data={}){const s=(await sb.auth.getSession()).data.session;if(!s){location.replace("../app/?return="+encodeURIComponent(location.pathname));throw Error("Please sign in")}const r=await fetch(url+"?action="+action,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function say(role,text){const n=document.createElement("div");n.className="turn "+role;n.textContent=text;$("feed").append(n);$("feed").scrollTop=$("feed").scrollHeight}
function listing(){const q=$("filter").value.toLowerCase();$("list").replaceChildren();for(const c of records.filter(x=>x.title.toLowerCase().includes(q))){const b=document.createElement("button");b.textContent=c.title;b.title=c.title;b.className=c.id===current?"selected":"";b.onclick=()=>openChat(c.id);$("list").append(b)}}
async function refresh(){records=(await api("web_conversations")).conversations||[];listing()}
async function loadTopics(refresh=false){try{const r=await api("topic_index",{refresh});topics=(r.topics||[]).filter(t=>Array.isArray(t.sources)&&t.sources.length);renderTopics();if(r.classification==="unavailable")$("status").textContent="Topic classifier is not configured."}catch(e){$("status").textContent="Topic grouping unavailable: "+e.message}}
function renderTopics(){const area=$("topics");area.replaceChildren();for(const t of topics){const b=document.createElement("button");b.textContent=t.title+" · "+(t.sources?.length||0);b.title=t.title;b.onclick=()=>openTopic(t.id);area.append(b)}if(!topics.length){const b=document.createElement("button");b.textContent="Group conversations by topic ↻";b.onclick=()=>loadTopics(true);area.append(b)}else{const b=document.createElement("button");b.textContent="↻ Update topics";b.onclick=()=>loadTopics(true);area.append(b)}}
async function openTopic(id){$("shell").classList.remove("open");$("feed").replaceChildren();current=null;const r=await api("topic_thread",{topic_id:id});const heading=document.createElement("h2");heading.textContent=r.topic.title;$("feed").append(heading);for(const c of r.conversations||[]){const label=document.createElement("h3");label.textContent=c.channel.toUpperCase()+" · "+c.title;$("feed").append(label);for(const m of c.messages||[])say(m.role==="user"?"user":"sandy",m.body)}const notice=document.createElement("p");notice.className="status";notice.textContent="This is a cross-channel reading view. Start a new web chat to send a message."; $("feed").append(notice)}
async function openChat(id){current=id;history.replaceState(null,"",location.pathname+"?conversation="+id);$("feed").replaceChildren();$("shell").classList.remove("open");listing();const d=await api("web_history",{conversation_id:id});for(const t of d.turns){say("user",t.question);if(t.response)say("sandy",t.response)}}
function newChat(){current=null;history.replaceState(null,"",location.pathname);$("feed").innerHTML='<div class="welcome">What can Sandy help with?</div>';$("shell").classList.remove("open");listing()}
$("new").onclick=newChat;$("menu").onclick=()=>$("shell").classList.toggle("open");$("filter").oninput=listing;$("question").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}};
$("form").onsubmit=async e=>{e.preventDefault();if(busy)return;const question=$("question").value.trim();if(question.length<2)return;busy=true;$("send").disabled=true;$("feed").querySelector(".welcome")?.remove();say("user",question);$("question").value="";$("status").textContent="Sandy is working…";try{if(!current){current=(await api("web_new_conversation")).conversation_id;history.replaceState(null,"",location.pathname+"?conversation="+current)}const r=await api("ask",{question,conversation_id:current,request_id:crypto.randomUUID(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone});say("sandy",r.response||"No response returned");await refresh();$("status").textContent="Saved to All Conversations."}catch(ex){say("sandy","Request could not complete: "+ex.message);$("status").textContent="Failed — please retry."}finally{busy=false;$("send").disabled=false}};
(async()=>{try{await refresh();await loadTopics(true);const id=new URLSearchParams(location.search).get("conversation");if(id)await openChat(id)}catch(e){$("status").textContent=e.message}})();
</script></body></html>
