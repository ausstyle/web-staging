server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Preserve the existing portal; never package application/control files here.
  location = /app {
    return 302 https://ausstyle.github.io/web-staging/sandy/app/$is_args$args;
  }
  location ^~ /app/ {
    return 302 https://ausstyle.github.io/web-staging/sandy$request_uri;
  }
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
  location / {
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }
}
